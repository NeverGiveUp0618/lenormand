<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雷诺曼 · 三十六牌</title>
<meta name="theme-color" content="#070b18">
<link rel="manifest" href="manifest.json">
<style>
:root{
  /* 深海夜空 · 双鱼 */
  --void:#070b18; --abyss:#0c1226; --panel:rgba(22,32,62,.66); --panel2:rgba(16,24,48,.82);
  --line:rgba(150,180,225,.16); --line2:rgba(150,180,225,.30);
  --mist:#c9d4e8; --dim:#8a99b8; --silver:#e8eef8;
  --aqua:#7fe3d4; --violet:#a68cff; --rose:#e08bb4; --gold:#e6c98a;
  --glow:0 0 18px rgba(127,227,212,.22);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--void); color:var(--mist);
  font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  min-height:100vh; position:relative;
}
/* 星海：星点 + 星云，固定不随滚动 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
   radial-gradient(1.4px 1.4px at 12% 8%,rgba(255,255,255,.9),transparent),
   radial-gradient(1px 1px at 27% 22%,rgba(214,232,255,.75),transparent),
   radial-gradient(1.6px 1.6px at 44% 6%,rgba(255,255,255,.8),transparent),
   radial-gradient(1px 1px at 61% 17%,rgba(190,215,255,.7),transparent),
   radial-gradient(1.3px 1.3px at 78% 9%,rgba(255,255,255,.85),transparent),
   radial-gradient(1px 1px at 91% 25%,rgba(200,225,255,.65),transparent),
   radial-gradient(1.2px 1.2px at 7% 41%,rgba(255,255,255,.7),transparent),
   radial-gradient(1px 1px at 33% 52%,rgba(190,215,255,.6),transparent),
   radial-gradient(1.5px 1.5px at 55% 44%,rgba(255,255,255,.75),transparent),
   radial-gradient(1px 1px at 71% 58%,rgba(205,230,255,.6),transparent),
   radial-gradient(1.2px 1.2px at 88% 47%,rgba(255,255,255,.7),transparent),
   radial-gradient(1px 1px at 18% 71%,rgba(195,220,255,.6),transparent),
   radial-gradient(1.4px 1.4px at 42% 79%,rgba(255,255,255,.7),transparent),
   radial-gradient(1px 1px at 66% 88%,rgba(200,225,255,.55),transparent),
   radial-gradient(1.2px 1.2px at 84% 74%,rgba(255,255,255,.65),transparent),
   radial-gradient(1px 1px at 96% 93%,rgba(190,215,255,.5),transparent);
  background-size:100% 100%;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
  background:
   radial-gradient(60% 45% at 15% -8%,rgba(120,86,214,.30),transparent 70%),
   radial-gradient(55% 40% at 92% 6%,rgba(40,140,158,.24),transparent 70%),
   radial-gradient(75% 50% at 50% 108%,rgba(46,78,170,.30),transparent 70%),
   linear-gradient(180deg,#080d1c 0%,#070b18 55%,#0a1024 100%);
}
.wrap{max-width:none;padding:14px 16px}
.rd{max-width:34em}

/* 顶栏 */
header.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(9,14,30,.94),rgba(9,14,30,.80));
  backdrop-filter:saturate(1.3) blur(10px);
  border-bottom:1px solid var(--line);
  padding:10px 16px 11px;display:flex;align-items:center;gap:10px;position:sticky;
}
header.top::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(127,227,212,.55),rgba(166,140,255,.45),transparent);
}
header.top h1{
  margin:0;font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--silver);
}
header.top .sub{font-size:12px;color:var(--dim);letter-spacing:.04em}
header.top .orn{margin-left:auto;flex:none;color:var(--violet);opacity:.75}
header.top .orn svg{width:74px;height:26px;display:block}
.back{border:0;background:none;color:var(--aqua);font-size:14px;padding:2px 6px 2px 0;cursor:pointer;font-family:var(--serif)}

/* 分节标题：♓ + 渐隐横线 */
h2.sec{
  font-family:var(--serif);font-size:14px;color:var(--dim);font-weight:600;letter-spacing:.22em;
  margin:24px 0 12px;display:flex;align-items:center;gap:9px;text-transform:none;
}
h2.sec .gl{color:var(--violet);flex:none;display:block;width:15px;height:15px;opacity:.9}
h2.sec::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(150,180,225,.32),transparent)}

.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.45);
  backdrop-filter:blur(6px);
}
.pad{padding:15px 17px}

/* 牌面 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tile{
  background:linear-gradient(180deg,rgba(26,38,70,.72),rgba(14,21,44,.86));
  border:1px solid var(--line);border-radius:12px;padding:11px 6px 9px;
  text-align:center;cursor:pointer;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 22px rgba(0,0,0,.4);
  transition:transform .14s,border-color .14s,box-shadow .14s;
}
.tile::before{ /* 牌面微光 */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 55% at 50% 0%,rgba(127,227,212,.10),transparent 70%);
}
.tile:active{transform:scale(.97)}
.tile .no{position:absolute;top:6px;left:8px;font-size:10px;color:var(--violet);letter-spacing:.08em;font-family:var(--serif)}
.tile .pk{position:absolute;top:6px;right:8px;font-size:10px;color:var(--dim)}
.tile svg{width:34px;height:34px;display:block;margin:9px auto 5px;color:var(--aqua);
  filter:drop-shadow(0 0 6px rgba(127,227,212,.35))}
.tile .nm{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--silver);letter-spacing:.06em}
.tile .en{font-size:10px;color:var(--dim);letter-spacing:.08em}
.tile.pos{border-color:rgba(127,227,212,.34)}
.tile.pos svg{color:var(--aqua)}
.tile.neg{border-color:rgba(224,139,180,.32)}
.tile.neg svg{color:var(--rose);filter:drop-shadow(0 0 6px rgba(224,139,180,.32))}
.tile.sel{border-color:var(--aqua);box-shadow:var(--glow),0 8px 22px rgba(0,0,0,.4)}
.pol{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);
  letter-spacing:.08em;font-family:var(--serif)}
.pol.p{color:var(--aqua);border-color:rgba(127,227,212,.42);background:rgba(127,227,212,.08)}
.pol.n{color:var(--rose);border-color:rgba(224,139,180,.42);background:rgba(224,139,180,.08)}
.pol.z{color:var(--dim)}

/* 牌义详情 */
.hero{display:flex;gap:15px;align-items:center;padding-bottom:14px;
  border-bottom:1px solid var(--line);position:relative}
.hero svg.big{width:58px;height:58px;flex:none;color:var(--aqua);
  filter:drop-shadow(0 0 12px rgba(127,227,212,.35))}
.hero .nm{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.3;color:var(--silver);letter-spacing:.06em}
.hero .meta{font-size:12px;color:var(--dim);letter-spacing:.08em}
dl.f{margin:0}
dl.f dt{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.24em;margin-top:16px;opacity:.9}
dl.f dd{margin:4px 0 0;color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:12px;background:rgba(150,180,225,.09);border:1px solid var(--line);
  border-radius:7px;padding:3px 9px;color:var(--dim)}
.chip.k{background:rgba(127,227,212,.10);border-color:rgba(127,227,212,.32);color:var(--aqua)}

/* 课程 */
.lesson-li{display:flex;gap:13px;align-items:center;padding:14px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;transition:background .14s}
.lesson-li:last-child{border-bottom:0}
.lesson-li:active{background:rgba(127,227,212,.06)}
.lesson-li .idx{width:28px;height:28px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(166,140,255,.9),rgba(80,60,160,.7));
  color:#fff;font-family:var(--serif);font-size:13px;display:grid;place-items:center;
  box-shadow:0 0 12px rgba(166,140,255,.35)}
.lesson-li .t{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--silver);letter-spacing:.04em}
.lesson-li .s{font-size:12px;color:var(--dim)}
.body p{margin:0 0 15px}
.body h3{font-family:var(--serif);font-size:16px;margin:24px 0 9px;color:var(--aqua);letter-spacing:.08em}
.ex{background:rgba(166,140,255,.07);border-left:2px solid var(--violet);
  border-radius:0 10px 10px 0;padding:11px 15px;margin:0 0 15px}
.ex b{display:block;font-family:var(--serif);font-size:14px;letter-spacing:.06em;color:var(--silver)}
.ex span{font-size:13px;color:var(--dim)}

/* 按钮 */
.btn{display:inline-block;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(26,38,70,.6),rgba(14,21,44,.75));
  color:var(--mist);border-radius:11px;padding:12px 15px;font:inherit;font-size:14px;
  cursor:pointer;text-align:left;width:100%;transition:.14s}
.btn:active{border-color:var(--line2)}
.btn b{font-family:var(--serif);color:var(--silver);letter-spacing:.05em}
.btn.on{border-color:var(--aqua);color:var(--aqua);box-shadow:var(--glow)}
.btn.ok{border-color:rgba(127,227,212,.6);color:var(--aqua);background:rgba(127,227,212,.10)}
.btn.bad{border-color:rgba(224,139,180,.6);color:var(--rose);background:rgba(224,139,180,.10)}
.btn.pri{background:linear-gradient(120deg,rgba(127,227,212,.20),rgba(166,140,255,.24));
  border-color:rgba(127,227,212,.45);color:var(--silver);text-align:center;
  font-family:var(--serif);font-weight:600;letter-spacing:.1em;box-shadow:var(--glow)}
.opts{display:grid;gap:9px;margin-top:15px}
.q{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.7;color:var(--silver);letter-spacing:.04em}
.bar{height:3px;background:rgba(150,180,225,.16);border-radius:3px;overflow:hidden;margin:11px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--violet));
  box-shadow:0 0 10px rgba(127,227,212,.5)}
.fb{margin-top:13px;font-size:14px;padding:11px 13px;border-radius:10px;border:1px solid var(--line)}
.fb.ok{background:rgba(127,227,212,.08);color:var(--aqua);border-color:rgba(127,227,212,.3)}
.fb.bad{background:rgba(224,139,180,.08);color:var(--rose);border-color:rgba(224,139,180,.3)}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1}
textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:rgba(8,13,28,.6);color:var(--mist)}
textarea{min-height:76px;resize:vertical}
textarea::placeholder,input::placeholder{color:rgba(138,153,184,.7)}
textarea:focus,input:focus{outline:none;border-color:rgba(127,227,212,.5);box-shadow:var(--glow)}
.mut{color:var(--dim);font-size:13px}

/* 抽牌 / 牌阵 */
.spread{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.spread .tile{width:106px;flex:none}
.spread .slot{font-family:var(--serif);font-size:11px;color:var(--gold);margin-top:6px;
  display:block;text-align:center;letter-spacing:.16em}
.nine{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:350px;margin:16px auto}
.nine .tile{width:auto}
/* 双鱼：两条鱼朝相反方向，中间一根绳——组合器的顺序隐喻 */
.fishpair{display:block;margin:2px auto 6px;width:150px;height:44px;color:var(--violet);opacity:.85}
.moon{width:15px;height:15px;vertical-align:-2px;margin-right:5px;color:var(--gold);opacity:.9}

/* 底栏 */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:linear-gradient(180deg,rgba(9,14,30,.86),rgba(7,11,24,.97));
  border-top:1px solid var(--line);backdrop-filter:blur(12px);
  padding:7px 0 calc(5px + env(safe-area-inset-bottom))}
nav.tab::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(127,227,212,.4),rgba(166,140,255,.35),transparent)}
nav.tab button{flex:1;border:0;background:none;padding:4px 0 2px;display:flex;flex-direction:column;
  align-items:center;gap:4px;font:inherit;font-size:11px;color:var(--dim);cursor:pointer;letter-spacing:.1em}
nav.tab .blk{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);
  background:rgba(26,38,70,.5);display:grid;place-items:center;
  font-family:var(--serif);font-size:15px;font-weight:600;color:var(--dim);transition:.18s}
nav.tab button.on .blk{
  background:linear-gradient(135deg,rgba(127,227,212,.95),rgba(166,140,255,.9));
  border-color:transparent;color:#0a1024;box-shadow:0 0 16px rgba(127,227,212,.35)}
nav.tab button.on{color:var(--aqua)}
@media(min-width:780px){.wrap{padding:20px 30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" hidden>‹ 返回</button>
  <div><h1 id="ttl">雷诺曼 · 三十六牌</h1><div class="sub" id="stl">学 · 查 · 练</div></div>
  <div class="orn" id="orn"></div>
</header>
<main id="view" class="wrap"></main>
<nav class="tab" id="nav"></nav>
<script src="data.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
